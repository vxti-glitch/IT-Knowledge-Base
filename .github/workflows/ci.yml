name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python style
        run: |
          ruff check kb tests
          ruff format --check kb tests
      - name: Validate published content
        run: python -m kb check --docs ./docs
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build the complete knowledge base
        run: python -m kb build --docs ./docs --output ./output
      - name: Upload validated static site
        uses: actions/upload-artifact@v7
        with:
          name: validated-knowledge-base
          path: ./output
          if-no-files-found: error
